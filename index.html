<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Keyboard Color Configurator</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- DAISYUI -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- SCRIPT -->
    <script src="./script.js" defer></script>
</head>

<body class="overflow-hidden">
    <main>
        <!-- TOP CONTAINER -->
        <div class="fixed top-0 left-0 w-full h-auto p-4 flex flex-row justify-between items-center">
            <div class="flex flex-row items-center gap-2">
                <!-- Keyboard layout selector -->
                <select id="keyboard_layout" class="select select-sm w-32 rounded" aria-label="Keyboard layout">
                    <option value="qwerty">QWERTY</option>
                    <option value="azerty">AZERTY</option>
                </select>

                <!-- Toggle sound button -->
                <button id="sound_toggle" type="button" class="btn btn-sm btn-square pt-0.5 flex justify-center items-center rounded bg-transparent" aria-label="Mute keyboard sound" aria-pressed="true" title="Mute keyboard sound">
                    <i class="bi bi-volume-up-fill text-lg" aria-hidden="true"></i>
                </button>
            </div>

            <!-- Toggle mode button -->
            <label class="swap swap-rotate">
                <input type="checkbox" class="theme-controller" value="black" />
                <i class="bi bi-sun-fill swap-on"></i>
                <i class="bi bi-moon-stars-fill swap-off"></i>
            </label>
        </div>

        <!-- CONFIGURATOR -->
        <div class="min-h-screen px-4 py-20 pt-24 flex flex-col justify-center items-center gap-4">
            <!-- Typing preview -->
            <input id="typing_preview" type="text" placeholder="Start typing or click the keyboard..." aria-label="Keyboard typing preview" spellcheck="false" readonly>

            <!-- Keyboard -->
            <div id="keyboard_container" class="w-full flex justify-center">
                <div id="keyboard_wrapper">
                    <div id="keyboard">
                        <div id="keyboard_background"></div>
                    </div>
                </div>
            </div>

            <!-- Keycap template -->
            <template id="keycap_template">
                <div class="keycap">
                    <div class="keycap_shadow">
                        <div class="keycap_top">
                            <span class="keycap_text"></span>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Color pickup -->
            <div id="color_pickup_container" class="w-full flex justify-center"></div>

            <!-- Reset colors button -->
            <div class="w-full max-w-[882px] flex justify-end">
                <button id="reset_colors" type="button" class="btn btn-ghost btn-sm rounded">
                    <i class="bi bi-arrow-counterclockwise mt-0.5"></i>
                    Reset colors
                </button>
            </div>
        </div>

        <!-- BOTTOM CONTAINER -->
        <div class="fixed left-0 bottom-0 w-full h-auto p-4 flex flex-row justify-between items-center">
            <!-- GitHub Link -->
            <a class="tooltip tooltip-right" data-tip="Click to visit the GitHub repository." href="https://github.com/fchavonet/creative_coding-custom_keyboard_color_configurator" target="_blank">
                <img src="https://img.shields.io/github/stars/fchavonet/creative_coding-custom_keyboard_color_configurator?style=social&label=GitHub%20Stars" alt="GitHub Stars">
            </a>

            <!-- Portfolio Link -->
            <a class="link link-hover text-xs" href="https://www.fchavonet.dev" target="_blank">
                www.fchavonet.dev
            </a>
        </div>

        <!-- RESPONSIVE WARNING -->
        <dialog id="responsive-warning" class="modal backdrop-blur-xl">
            <div class="modal-box max-w-xs flex flex-col justify-center items-center gap-4 text-center rounded-xl bg-base-300">
                <i class="bi bi-aspect-ratio text-4xl"></i>

                <p class="text-lg font-semibold -mt-2">
                    This web application is designed for larger screens.
                </p>

                <p class="text-xs">
                    A mobile-friendly version is coming soon...
                </p>
            </div>
        </dialog>
    </main>
</body>

</html>
